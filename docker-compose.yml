services:
  morphovolc:
    build: .
    container_name: morphovolc
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      PYTHON_BIN: "/opt/venv/bin/python"
      HEADLESS: "1"
      MPLBACKEND: "Agg"
      QT_QPA_PLATFORM: "offscreen"
      UPLOADS_DIR: "/app/backend/uploads"
      OUTPUTS_DIR: "/app/backend/outputs"
      FRONTEND_BUILD_DIR: "/app/frontend/build"
      USE_VOLUME_UNIFIED: "1"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/outputs:/app/backend/outputs
      - ./frontend/public/images:/app/frontend/public/images:ro   # <-- AGGIUNGI QUESTA
    restart: unless-stopped
